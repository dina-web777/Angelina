<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGELINA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Montserrat:wght@100;200;400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Кастомний курсор */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* --- КАСТОМНИЙ КУРСОР --- */
        #cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--gold);
            position: fixed;
            border-radius: 50%;
            z-index: 10000;
            pointer-events: none;
            transition: transform 0.1s ease;
        }
        #cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid var(--gold);
            position: fixed;
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transition: transform 0.2s ease, left 0.15s ease-out, top 0.15s ease-out;
        }

        /* --- ЕФЕКТ ЧАСТИНОК (Золотий пил) --- */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* --- ПРЕЛОАДЕР --- */
        .preloader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .preloader-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            letter-spacing: 15px;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--gold);
            animation: typing 2s steps(10, end), blink .5s step-end infinite alternate;
        }
        @keyframes typing { from { width: 0 } to { width: 320px } }
        @keyframes blink { from { border-color: transparent } to { border-color: var(--gold) } }

        /* --- HERO СЕКЦІЯ --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }
        .hero-img-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.4);
            transform: scale(1.1);
            transition: transform 0.5s ease-out;
        }
        .hero-title {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .hero-title h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(4rem, 18vw, 12rem);
            font-weight: 300;
            line-height: 0.8;
            margin: 20px 0;
            letter-spacing: -5px;
        }
        .hero-title h1 span {
            color: var(--gold);
            font-style: italic;
            display: block;
            margin-left: 10vw;
        }

        /* --- СЕКЦІЯ ГАЛЕРЕЇ (VOGUE STYLE) --- */
        .gallery {
            padding: 100px 10vw;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 40px 20px;
            z-index: 2;
            position: relative;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            background: #111;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
            opacity: 1;
        }
        .gallery-item::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .g-1 { grid-column: 1 / 9; height: 80vh; }
        .g-2 { grid-column: 9 / 13; height: 50vh; align-self: end; }
        .g-3 { grid-column: 1 / 5; height: 60vh; margin-top: -10vh; }
        .g-4 { grid-column: 5 / 13; height: 90vh; }

        /* --- ЦИТАТА --- */
        .quote-sec {
            padding: 150px 10%;
            text-align: center;
            background: linear-gradient(to bottom, transparent, #111, transparent);
        }
        .quote-sec blockquote {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-style: italic;
            color: var(--gold);
            position: relative;
        }
        .quote-sec blockquote::before {
            content: "“";
            position: absolute;
            font-size: 8rem;
            top: -60px; left: 50%;
            transform: translateX(-50%);
            opacity: 0.1;
        }

        /* --- ВІДЕО ПЛЕЄР --- */
        .video-container {
            padding: 50px 10vw;
            display: flex;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            max-width: 1100px;
            border-radius: 2px;
            border: 1px solid var(--gold-soft);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .footer-text {
            padding: 10px 0 10px;
            text-align: center;
        }

        /* --- ФУТЕР --- */
        footer {
            padding: 30px 0 50px;
            text-align: center;
        }
        .social-link {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: #fff;
            text-decoration: none;
            position: relative;
            padding: 10px 40px;
            border: 1px solid var(--gold-soft);
            border-radius: 100px;
            transition: all 0.5s;
        }
        .social-link:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            letter-spacing: 5px;
        }

        /* --- АДАПТИВНІСТЬ --- */
        @media (max-width: 768px) {
            #cursor-dot, #cursor-outline { display: none; }
            * { cursor: auto !important; }
            .gallery { grid-template-columns: 1fr; gap: 20px; padding: 50px 5vw; }
            .gallery-item { grid-column: 1 / -1 !important; height: 450px !important; margin-top: 0 !important; }
            .hero-title h1 { font-size: 3.5rem; letter-spacing: -2px; }
            .hero-title h1 span { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div class="preloader" id="preloader">
        <div class="preloader-title">ANGELINA</div>
    </div>

    <canvas id="particles"></canvas>

    <main>
        <section class="hero" id="hero">
            <div class="hero-img-container">
                <img src="css/1.jpg" class="hero-img" id="heroImg">
            </div>
            <div class="hero-title">
                <p data-aos="fade-down" data-aos-delay="2500" style="letter-spacing: 10px; font-weight: 200;">BULKA PRODUCTION</p>
                <h1 data-aos="fade-up" data-aos-delay="2200">
                    ANGE<span>LINA</span>
                </h1>
            </div>
        </section>

        <section class="quote-sec">
            <blockquote data-aos="fade-in">
                Твої очі — це те що я згадую з посмішкою.
            </blockquote>
        </section>

        <section class="gallery">
            <div class="gallery-item g-1" data-aos="fade-right">
                <img src="css/2.jpg" alt="Aesthetic 1">
            </div>
            <div class="gallery-item g-2" data-aos="fade-left" data-aos-delay="200">
                <img src="css/3.jpg" alt="Aesthetic 2">
            </div>
            <div class="gallery-item g-3" data-aos="fade-up">
                <img src="css/4.jpg" alt="Aesthetic 3">
            </div>
            <div class="gallery-item g-4" data-aos="zoom-in">
                <img src="css/5.jpg" alt="Aesthetic 4">
            </div>
        </section>

        <section class="video-container" data-aos="fade-up">
            <video controls poster="css/poster.jpg" playsinline>
                <source src="css/1.mp4" type="video/mp4">
            </video>
        </section>

        <div class="footer-text">ONE MONTH TOGETHER</div>

        <footer>
            <p style="margin-top: 80px; opacity: 30; font-size: 0.6rem; letter-spacing: 4px;">10.11.2026</p>
        </footer>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Ініціалізація анімацій
        AOS.init({ duration: 1200, once: false });

        // Прибираємо прелоадер
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('preloader').style.transform = 'translateY(-100%)';
                document.getElementById('preloader').style.transition = 'transform 1s cubic-bezier(0.19, 1, 0.22, 1)';
            }, 2500);
        });

        // Кастомний курсор
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');

        window.addEventListener('mousemove', (e) => {
            const posX = e.clientX;
            const posY = e.clientY;

            dot.style.left = `${posX}px`;
            dot.style.top = `${posY}px`;

            outline.animate({
                left: `${posX}px`,
                top: `${posY}px`
            }, { duration: 500, fill: "forwards" });
        });

        // Паралакс головного зображення
        window.addEventListener('scroll', () => {
            const scroll = window.pageYOffset;
            const heroImg = document.getElementById('heroImg');
            heroImg.style.transform = `scale(${1.1 + scroll/5000}) translateY(${scroll/10}px)`;
        });

        // Ефект золотих частинок
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.001;
            }
            draw() {
                ctx.fillStyle = 'rgba(212, 175, 55, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 100; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
                if (particlesArray[i].size <= 0.2) {
                    particlesArray.splice(i, 1);
                    i--;
                    particlesArray.push(new Particle());
                }
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();
    </script>
</body>
</html>
